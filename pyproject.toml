[project]
name = "fizzbuzz-kata"
version = "0.1.0"
description = "A TDD kata: FizzBuzz, from notebook exploration to a tested, published package"
readme = "README.md"
authors = [
    { email = "ouguzine.douaa@gmail.com" }
]
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
fizzbuzz-kata = "fizzbuzz_kata:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

